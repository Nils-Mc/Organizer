name = "organizer"
main = "worker/src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# The app is served straight from web/ — there is no build step.
[assets]
directory = "web"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "organizer"
database_id = "7afd7553-5cc5-44c3-a498-e14cbca40f49"

[ai]
binding = "AI"

# --- Optional: uploads and transcription -------------------------------------
# R2 is not enabled on this account yet, and Queues need the Workers Paid plan.
# Both bindings stay commented out so the Worker deploys and runs today: sync,
# subjects, notes, homework, exams and search all work without them. Uploading a
# file answers with a clear error instead of crashing until you enable R2 in the
# Cloudflare dashboard and uncomment the block below.
#
#   1. Dashboard -> R2 -> "Enable R2"
#   2. npx wrangler r2 bucket create organizer-media
#   3. npx wrangler queues create organizer-transcribe   (needs Workers Paid)
#   4. Uncomment, then: npx wrangler deploy
#
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "organizer-media"
#
# [[queues.producers]]
# binding = "TRANSCRIBE_QUEUE"
# queue = "organizer-transcribe"
#
# [[queues.consumers]]
# queue = "organizer-transcribe"
# max_batch_size = 1
# max_retries = 3

# Every 30 minutes on weekdays between 06:00 and 18:00 UTC. Outside school hours
# there is nothing to pick up, and Untis should not be polled for nothing.
[triggers]
crons = ["*/30 6-18 * * 1-5"]

[vars]
UNTIS_HOST = "REPLACE.webuntis.com"
UNTIS_SCHOOL = "REPLACE"

# Secrets are set with `wrangler secret put` and never live in this file:
#   UNTIS_USER, UNTIS_PASSWORD, ANTHROPIC_API_KEY,
#   SESSION_SECRET, PASSWORD_HASH, PASSWORD_SALT
