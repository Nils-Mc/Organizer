<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organizer</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128203;</text></svg>">
</head>
<body>
<a class="skip-link" href="#main">Skip to tasks</a>

<header class="topbar">
  <button id="menu-toggle" class="icon-btn" aria-label="Toggle sidebar" aria-expanded="false">&#9776;</button>
  <h1 class="brand">Organizer</h1>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search tasks…  ( / )" aria-label="Search tasks" autocomplete="off">
  </div>
  <label class="sort-wrap">
    <span class="visually-hidden">Sort by</span>
    <select id="sort" aria-label="Sort tasks by">
      <option value="due">Due date</option>
      <option value="priority">Priority</option>
      <option value="created">Newest</option>
      <option value="title">Title</option>
    </select>
  </label>
  <button id="theme-toggle" class="icon-btn" aria-label="Toggle colour theme" title="Toggle colour theme">&#9788;</button>
</header>

<div class="layout">
  <nav id="sidebar" class="sidebar" aria-label="Views and projects">
    <h2 class="side-heading">Views</h2>
    <ul id="view-list" class="side-list"></ul>

    <h2 class="side-heading">
      Projects
      <button id="add-project" class="link-btn" type="button">+ New</button>
    </h2>
    <ul id="project-list" class="side-list"></ul>

    <h2 class="side-heading">Data</h2>
    <div class="side-actions">
      <button id="export-btn" class="link-btn" type="button">Export JSON</button>
      <button id="import-btn" class="link-btn" type="button">Import JSON</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
    </div>
  </nav>

  <main id="main" class="main">
    <div class="main-head">
      <h2 id="view-title">Today</h2>
      <p id="view-summary" class="view-summary"></p>
    </div>

    <form id="new-task-form" class="new-task" autocomplete="off">
      <input id="new-task-title" type="text" placeholder="Add a task…  use #tag to tag it  ( n )" aria-label="New task title" required>
      <input id="new-task-due" type="date" aria-label="Due date">
      <select id="new-task-priority" aria-label="Priority">
        <option value="low">Low</option>
        <option value="normal" selected>Normal</option>
        <option value="high">High</option>
      </select>
      <select id="new-task-project" aria-label="Project"></select>
      <button type="submit" class="primary-btn">Add</button>
    </form>

    <div id="task-container" class="task-container"></div>
  </main>
</div>

<div id="toast" class="toast" hidden>
  <span id="toast-text"></span>
  <button id="toast-action" class="link-btn" type="button">Undo</button>
</div>

<div id="live-region" class="visually-hidden" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
