name: Test and deploy to Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Allow one deployment at a time; a run that is already publishing is left
# to finish rather than being cancelled mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The app has no dependencies, so there is nothing to install.
      - name: Run unit tests
        run: node tests/run.js

  deploy:
    name: Deploy to GitHub Pages
    # Never publish a broken site, and only ever publish from main.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The repository root is the site: there is no build step to run.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
